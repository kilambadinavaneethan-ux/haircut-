# Supabase CLI local configuration
project_id = "quickcut-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329

[realtime]
enabled = true
port = 54323

[studio]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000", "exp://*"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_positive_sign_in = true
enable_confirmations = false
